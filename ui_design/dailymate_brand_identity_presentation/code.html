<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <defs>
    <!-- Background subtle mesh gradient -->
    <radialGradient id="bgGlow" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>

    <!-- App Icon Gradient -->
    <linearGradient id="appIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Accent Emerald/Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadowCard" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <filter id="shadowAppIcon" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>

    <filter id="shadowTealDot" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="1200" fill="url(#bgGlow)"/>

  <!-- Subtle Blueprint / Grid Lines in background -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 8">
    <line x1="80" y1="130" x2="1520" y2="130"/>
    <line x1="80" y1="670" x2="1520" y2="670"/>
    <line x1="800" y1="130" x2="800" y2="1120"/>
  </g>

  <!-- ==================== HEADER / META ==================== -->
  <g transform="translate(80, 70)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="138" height="28" rx="14" fill="#0F172A"/>
    <text x="69" y="18" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">BRAND IDENTITY</text>
    
    <text x="156" y="20" fill="#64748B" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">Design System &amp; Guidelines v1.0</text>
    <text x="1440" y="20" fill="#94A3B8" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" text-anchor="end">DailyMate · Personal Finance Buddy</text>
  </g>

  <!-- ==================== SECTION 1: HERO PRIMARY HORIZONTAL LOGO (Top Left Card) ==================== -->
  <g transform="translate(80, 150)" filter="url(#shadowCard)">
    <rect width="880" height="480" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Subtle Label -->
    <text x="48" y="52" fill="#94A3B8" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">PRIMARY IDENTITY / HORIZONTAL LOCKUP</text>

    <!-- The Primary Mark + Wordmark Group -->
    <g transform="translate(130, 165)">
      <!-- DailyMate Dynamic Companion Symbol (160x160 canvas centered) -->
      <g transform="translate(0, 0)">
        <!-- Outer Continuity Ring (Representing daily cycles and financial journey) -->
        <path d="M75,20 A55,55 0 1,1 25,70" fill="none" stroke="#0F172A" stroke-width="15" stroke-linecap="round"/>
        <!-- Inner Protective Companion Arc (Warm gesture embracing financial health) -->
        <path d="M48,84 A34,34 0 0,1 106,58" fill="none" stroke="#0D9488" stroke-width="14" stroke-linecap="round"/>
        <!-- Upward Momentum Spark / Focal Checkpoint -->
        <circle cx="112" cy="30" r="14" fill="#10B981" filter="url(#shadowTealDot)"/>
        <path d="M107,30 L111,34 L118,26" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Wordmark: DailyMate -->
      <g transform="translate(170, 95)">
        <text font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="78" font-weight="800" letter-spacing="-1.5">
          <tspan fill="#0F172A">Daily</tspan><tspan fill="#0D9488">Mate</tspan>
        </text>
        <!-- Tagline -->
        <text x="4" y="38" fill="#64748B" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
          Your Personal Finance Companion
        </text>
      </g>
    </g>

    <!-- Visual Foundation Notes / Pills -->
    <g transform="translate(48, 415)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#F1F5F9"/>
      <circle cx="18" cy="17" r="5" fill="#0F172A"/>
      <text x="32" y="21" fill="#334155" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Deep Navy #0F172A</text>

      <rect x="194" y="0" width="168" height="34" rx="17" fill="#F0FDF4"/>
      <circle cx="212" cy="17" r="5" fill="#10B981"/>
      <text x="226" y="21" fill="#065F46" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Emerald #10B981</text>

      <rect x="376" y="0" width="158" height="34" rx="17" fill="#F0FDFA"/>
      <circle cx="394" cy="17" r="5" fill="#0D9488"/>
      <text x="408" y="21" fill="#115E59" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Soft Teal #0D9488</text>

      <text x="770" y="21" fill="#94A3B8" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" text-anchor="end">Ratio 1:1.618 · Clear Space 2.5X</text>
    </g>
  </g>

  <!-- ==================== SECTION 2: APP ICON DISPLAY (Top Right Card) ==================== -->
  <g transform="translate(1000, 150)" filter="url(#shadowCard)">
    <rect width="520" height="480" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="44" y="52" fill="#94A3B8" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">MOBILE APP ICON (iOS &amp; ANDROID)</text>

    <!-- Big Rounded App Icon with realistic squircle -->
    <!-- iOS Standard App Icon Canvas 220x220 with rx="50" -->
    <g transform="translate(150, 105)" filter="url(#shadowAppIcon)">
      <rect width="220" height="220" rx="52" fill="url(#appIconGrad)"/>
      <rect width="220" height="220" rx="52" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>

      <!-- App Icon Inner Graphic -->
      <g transform="translate(35, 35)">
        <!-- Outer Arc in pure white -->
        <path d="M96,25 A70,70 0 1,1 32,90" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round"/>
        <!-- Inner Arc in vivid Teal -->
        <path d="M60,108 A44,44 0 0,1 136,74" fill="none" stroke="#14B8A6" stroke-width="17" stroke-linecap="round"/>
        <!-- Sparkling Smart Goal / Upward Dot -->
        <circle cx="142" cy="38" r="18" fill="#10B981" filter="url(#shadowTealDot)"/>
        <path d="M136,38 L141,43 L150,33" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- App Name Label under Icon -->
    <text x="260" y="375" fill="#0F172A" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" text-anchor="middle">DailyMate</text>
    <text x="260" y="398" fill="#64748B" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" text-anchor="middle">Home Screen Presence · 512×512 HD</text>

    <!-- Micro preview pills (Dock / Folder context) -->
    <g transform="translate(180, 420)">
      <!-- Tiny icon 1 -->
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#0F172A"/>
      <circle cx="17" cy="17" r="7" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
      <circle cx="21" cy="13" r="2.5" fill="#10B981"/>

      <rect x="44" y="0" width="34" height="34" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
      <circle cx="61" cy="17" r="7" stroke="#0F172A" stroke-width="2.5" fill="none"/>
      <circle cx="65" cy="13" r="2.5" fill="#0D9488"/>

      <rect x="88" y="0" width="34" height="34" rx="8" fill="#10B981"/>
      <circle cx="105" cy="17" r="7" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
      <circle cx="109" cy="13" r="2.5" fill="#0F172A"/>

      <text x="132" y="21" fill="#94A3B8" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500">16px, 32px &amp; 48px icons</text>
    </g>
  </g>

  <!-- ==================== SECTION 3: DARK MODE VARIANT (Bottom Left Card 1) ==================== -->
  <g transform="translate(80, 670)" filter="url(#shadowCard)">
    <rect width="450" height="450" rx="28" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <text x="40" y="48" fill="#64748B" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">DARK BACKGROUND LOCKUP</text>

    <!-- Logo on Dark -->
    <g transform="translate(50, 160)">
      <!-- Symbol on Dark -->
      <g transform="translate(0, 0)">
        <path d="M60,16 A44,44 0 1,1 20,56" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
        <path d="M38,67 A27,27 0 0,1 85,46" fill="none" stroke="#2DD4BF" stroke-width="11" stroke-linecap="round"/>
        <circle cx="90" cy="24" r="11" fill="#10B981"/>
        <path d="M86,24 L89,27 L95,21" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Wordmark on Dark -->
      <g transform="translate(125, 68)">
        <text font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
          <tspan fill="#FFFFFF">Daily</tspan><tspan fill="#2DD4BF">Mate</tspan>
        </text>
      </g>
    </g>

    <!-- Bottom spec badge -->
    <g transform="translate(40, 375)">
      <rect width="370" height="40" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="20" y="25" fill="#94A3B8" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">
        Optimized for OLED displays &amp; Dark Theme
      </text>
    </g>
  </g>

  <!-- ==================== SECTION 4: STACKED & MONOCHROME VARIANT (Bottom Center Card) ==================== -->
  <g transform="translate(560, 670)" filter="url(#shadowCard)">
    <rect width="450" height="450" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="40" y="48" fill="#94A3B8" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">VERTICAL STACKED / ALL-PURPOSE</text>

    <!-- Stacked Logo -->
    <g transform="translate(225, 205)">
      <!-- Symbol centered -->
      <g transform="translate(-45, -95)">
        <path d="M55,15 A40,40 0 1,1 18,52" fill="none" stroke="#0F172A" stroke-width="11" stroke-linecap="round"/>
        <path d="M35,62 A25,25 0 0,1 78,43" fill="none" stroke="#0D9488" stroke-width="10" stroke-linecap="round"/>
        <circle cx="82" cy="22" r="10" fill="#10B981"/>
        <path d="M79,22 L82,25 L87,19" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Wordmark centered -->
      <text y="42" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" letter-spacing="-1" text-anchor="middle">
        <tspan fill="#0F172A">Daily</tspan><tspan fill="#0D9488">Mate</tspan>
      </text>
      <text y="72" fill="#64748B" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">
        FINANCE COMPANION
      </text>
    </g>

    <!-- Spec info -->
    <g transform="translate(40, 375)">
      <rect width="370" height="40" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="20" y="25" fill="#64748B" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">
        Ideal for Splash Screens &amp; Printed Collateral
      </text>
    </g>
  </g>

  <!-- ==================== SECTION 5: MONOCHROME & GEOMETRIC GRID (Bottom Right Card) ==================== -->
  <g transform="translate(1040, 670)" filter="url(#shadowCard)">
    <rect width="480" height="450" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="40" y="48" fill="#94A3B8" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">MONOCHROME &amp; GEOMETRIC ANATOMY</text>

    <!-- Top: 1-Color Black Mark -->
    <g transform="translate(50, 110)">
      <!-- Pure 1-color black icon -->
      <g transform="translate(0, 0)">
        <path d="M42,12 A30,30 0 1,1 14,40" fill="none" stroke="#000000" stroke-width="8.5" stroke-linecap="round"/>
        <path d="M27,48 A19,19 0 0,1 60,33" fill="none" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
        <circle cx="63" cy="17" r="7.5" fill="#000000"/>
        <path d="M60,17 L62,19 L66,15" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="88" y="42" fill="#000000" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
        DailyMate
      </text>
      <text x="88" y="62" fill="#64748B" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Single-Color Black (Receipts / Emboss)</text>
    </g>

    <!-- Divider -->
    <line x1="40" y1="210" x2="440" y2="210" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Bottom: Construction / Geometry Anatomy Diagram -->
    <g transform="translate(50, 235)">
      <text x="0" y="16" fill="#0F172A" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Symbol Construction Anatomy</text>
      <text x="0" y="36" fill="#64748B" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="400">Harmonic dual concentric cycles + positive checkmark</text>

      <g transform="translate(20, 50)">
        <!-- Construction guides -->
        <circle cx="60" cy="60" r="50" fill="none" stroke="#93C5FD" stroke-width="1" stroke-dasharray="3 3"/>
        <circle cx="60" cy="60" r="32" fill="none" stroke="#A7F3D0" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="60" y1="0" x2="60" y2="120" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 4"/>
        <line x1="0" y1="60" x2="120" y2="60" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="2 4"/>

        <!-- Mini Mark -->
        <path d="M78,25 A42,42 0 1,1 26,60" fill="none" stroke="#0F172A" stroke-width="9" stroke-linecap="round"/>
        <path d="M40,71 A26,26 0 0,1 82,51" fill="none" stroke="#0D9488" stroke-width="8" stroke-linecap="round"/>
        <circle cx="86" cy="29" r="8" fill="#10B981"/>

        <!-- Annotations -->
        <text x="140" y="32" fill="#0F172A" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">1. Continuity Ring</text>
        <text x="140" y="48" fill="#64748B" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="11">Daily habit &amp; money flow</text>

        <text x="140" y="74" fill="#0D9488" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">2. Companion Arc</text>
        <text x="140" y="90" fill="#64748B" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="11">Warm personal support</text>

        <text x="140" y="116" fill="#10B981" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">3. Progress Checkmark</text>
        <text x="140" y="132" fill="#64748B" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-size="11">Completed daily targets</text>
      </g>
    </g>
  </g>
</svg>
